name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }

          $checksumFile = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  $($installer.Name)" | Set-Content $checksumFile

          $signatureFile = Get-Item "$($installer.FullName).sig"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/$($installer.Name)"
          $latestFile = Join-Path $env:RUNNER_TEMP "latest.json"
          $latest = [ordered]@{
            version = $version
            notes = "See the GitHub release notes for Orbit $env:GITHUB_REF_NAME."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $signatureFile.FullName -Raw).Trim()
                url = $releaseUrl
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content $latestFile

          $releaseNotesFile = Join-Path $env:RUNNER_TEMP "RELEASE_NOTES.md"
          git for-each-ref "refs/tags/$env:GITHUB_REF_NAME" --format="%(contents)" | Set-Content $releaseNotesFile
          if (-not (Get-Content $releaseNotesFile -Raw).Trim()) {
            throw "The annotated release tag does not contain release notes."
          }

          gh release create $env:GITHUB_REF_NAME `
            $installer.FullName `
            $signatureFile.FullName `
            $latestFile `
            $checksumFile `
            --verify-tag `
            --title "Orbit $env:GITHUB_REF_NAME" `
            --notes-file $releaseNotesFile
