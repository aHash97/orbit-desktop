[package]
name = "orbit"
version = "0.3.0"
description = "Desktop hub orbs for launching shortcuts"
authors = ["aHash97"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/aHash97/orbit-desktop"
repository = "https://github.com/aHash97/orbit-desktop"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_System_Com",
  "Win32_UI_Shell_Common",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
